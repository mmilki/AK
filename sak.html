<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAK</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1c2420;--mut:#66726b;--line:#d9dfda;--pri:#1f5c46;--priInk:#fff;--bad:#b3261e;--ok:#1f6b3a;--warn:#b45309}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1d2621;--ink:#e8eee9;--mut:#93a39a;--line:#33403a;--pri:#4caf86;--priInk:#08140e;--bad:#ff8a80;--ok:#7fd69b;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#141a17;--card:#1d2621;--ink:#e8eee9;--mut:#93a39a;--line:#33403a;--pri:#4caf86;--priInk:#08140e;--bad:#ff8a80;--ok:#7fd69b;--warn:#fbbf24}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:5px;overflow-y:auto;max-height:100vh;position:sticky;top:0}
aside h1{font-size:14px;margin:0 0 4px;line-height:1.3}
aside small{color:var(--mut);font-size:11px}
.day{padding:7px 9px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:none;color:inherit;text-align:left;font:inherit;font-size:13px}
.day.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent)}
.day b{display:block;font-size:12px}.day span{color:var(--mut);font-size:11px}
main{padding:16px;min-width:0}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 11px;cursor:pointer}
button.p{background:var(--pri);color:var(--priInk);border-color:var(--pri);font-weight:600}
button.d{color:var(--bad);border-color:transparent;background:none}
button.sm{padding:3px 8px;font-size:12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap;overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:4px 4px 0 0;background:none;padding:7px 12px;font-size:13px;white-space:nowrap}
.tabs button.on{border-color:var(--pri);font-weight:700;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.card-title{font-weight:700;margin-bottom:10px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
label{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 7px}
select{cursor:pointer}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left;vertical-align:middle}
th{font-size:11px;color:var(--mut);font-weight:600;background:color-mix(in srgb,var(--line) 30%,transparent)}
td.n,th.n{text-align:right}
td input,td select{padding:3px 5px;min-width:55px}
td.num input{text-align:right}
.amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px}
.sumbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:10px}
.sumbox div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--card)}
.sumbox small{font-size:11px;color:var(--mut)}
.sumbox b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
.sync-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.sync-bar-fill{height:100%;background:var(--pri);transition:width .3s;border-radius:3px}
.master-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);margin-bottom:5px}
.rekap-table td,.rekap-table th{padding:4px 8px}
.rekap-table .good{background:color-mix(in srgb,var(--ok) 10%,transparent)}
.rekap-table .over{background:color-mix(in srgb,var(--bad) 10%,transparent)}
.foto-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.foto-item{position:relative;width:120px}
.foto-item img{width:120px;height:90px;object-fit:cover;border-radius:6px;border:2px solid var(--line);cursor:pointer}
.foto-item .del-foto{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;padding:0;cursor:pointer}
.foto-item .foto-ket{font-size:11px;color:var(--mut);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dok-item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.dok-item-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.absen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:8px 0}
.absen-day-col{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center;font-size:12px}
.absen-day-col b{display:block;font-size:11px;color:var(--mut)}
.absen-day-col input[type=checkbox]{width:18px;height:18px;cursor:pointer}
.pay-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.paper{background:#fff;color:#000;padding:24px 30px;font:13px/1.5 "Times New Roman",serif;border:1px solid var(--line);margin-bottom:16px;max-width:900px}
.paper table{font-size:12px}.paper th,.paper td{border:1px solid #000;padding:3px 5px;color:#000}.paper th{color:#000;text-align:center}
.paper p{margin:6px 0}
.sign{display:flex;justify-content:space-between;margin-top:22px;text-align:center}
.sign div{min-width:200px}
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;align-items:center;justify-content:center;flex-direction:column}
#lb.show{display:flex}
#lb img{max-width:90vw;max-height:80vh;border-radius:8px}
#lb p{color:#fff;margin-top:8px;font-size:14px}
#lb button{position:absolute;top:16px;right:20px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);position:static;max-height:none}}
@media print{aside,.tabs,.noprint{display:none!important}.app{display:block}main{padding:0}.paper{border:0;padding:0;margin:0;max-width:none;page-break-after:always}body{background:#fff}}
</style></head><body>

<!-- === HALAMAN LOGIN SEDERHANA === -->
<div id="loginScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;">
  <div class="card" style="width:100%;max-width:320px;box-shadow:0 10px 20px rgba(0,0,0,0.1);">
    <h2 style="margin:0 0 10px;text-align:center;">Welcome</h2>
    <p style="font-size:12px;color:var(--mut);text-align:center;margin-bottom:16px;">Masukkan Username dan Password Anda.</p>
    
    <label>Username</label>
    <input type="text" id="loginUser" placeholder="Masukkan Username" style="margin-bottom:10px;">
    
    <label>Password</label>
    <input type="password" id="loginPass" placeholder="Masukkan Password" style="margin-bottom:16px;">
    
    <div id="urlRow" style="display:none;margin-bottom:16px">
      <label>Alamat Server (Apps Script /exec)</label>
      <input type="text" id="loginUrl" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <button class="p" id="btnLogin" style="width:100%;padding:10px;">Masuk Aplikasi</button>
    <div id="loginMsg" style="color:var(--bad);font-size:12px;margin-top:10px;text-align:center;"></div>
  </div>
</div>

<div class="app">
<aside class="noprint">
  <h1>RAB & SPP<br><small>SPPG Polres Ogan Ilir 4</small></h1>
  <button class="p" id="newDay" style="font-size:13px">+ Hari baru</button>
  <div id="days" style="display:flex;flex-direction:column;gap:4px"></div>
  <hr style="border:0;border-top:1px solid var(--line);margin:4px 0">
  <small id="saveNote">Mode lokal</small>
  <div class="sync-bar"><div class="sync-bar-fill" id="syncFill" style="width:0%"></div></div>
  <button id="conn" style="font-size:12px">🔄 Sinkron Sekarang</button>
  <button id="reload" style="font-size:12px">↻ Muat dari Server</button>
  <button id="logout" style="font-size:12px">⎋ Keluar</button>
  <button id="csv" class="p" style="font-size:12px">⬇ Ekspor CSV</button>
  <div class="row" style="margin:0">
    <button id="exp" style="font-size:12px">💾 Cadangan</button>
    <button id="imp" style="font-size:12px">📂 Impor JSON</button>
  </div>
  <button id="rabImpBtn" style="font-size:12px;border-color:var(--pri);color:var(--pri);font-weight:600">📥 Import RAB Excel</button>
  <button id="rabTplDl" style="font-size:11px">⬇ Template Excel RAB</button>
  <button id="dedupBtn" style="font-size:11px;color:var(--warn);border-color:var(--warn)">🧹 Bersihkan Duplikat</button>
</aside>
<main>
  <div class="tabs noprint" id="tabs"></div>
  <div id="view"></div>
</main>
</div>
<div id="lb"><button id="lbClose">✕</button><img id="lbImg" src="" alt=""><p id="lbCap"></p></div>
<input type="file" id="file" accept=".json" hidden>
<input type="file" id="fotoInput" accept="image/*" multiple hidden>
<input type="file" id="xlsInput" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="xlsRabInput" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="xlsRelInput" accept=".xlsx,.xls,.csv" hidden>
<script>
const rp=n=>"Rp "+Math.round(n||0).toLocaleString("id-ID");
const num=v=>parseFloat(String(v).replace(/[^\d.]/g,""))||0;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="rab-spp-v4";

// === DEFAULT DATA ===
const defPay=[
  {id:"pangan",label:"Bahan pangan",nama:"",bank:"",rek:""},
  {id:"kop",label:"Operasional (Koperasi)",nama:"",bank:"",rek:""},
  {id:"air",label:"Air minum",nama:"",bank:"",rek:""}
];
const defMaster=[
  {id:"mb1",nama:"BERAS TOPI KOKI (10 KG)",satuan:"KARUNG",harga:155000,jenis:"bahan"},
  {id:"mb2",nama:"AYAM POTONG",satuan:"KG",harga:41000,jenis:"bahan"},
  {id:"mb3",nama:"TAHU SAYUR",satuan:"PCS",harga:700,jenis:"bahan"},
  {id:"mb4",nama:"WORTEL",satuan:"KG",harga:18000,jenis:"bahan"},
  {id:"mb5",nama:"MELON",satuan:"KG",harga:18000,jenis:"bahan"},
  {id:"mo1",nama:"Mama Lemon",satuan:"Pcs",harga:10000,jenis:"ops"},
  {id:"mo2",nama:"Masker",satuan:"Kotak",harga:28000,jenis:"ops"},
  {id:"mo3",nama:"Air Minum Isi Ulang",satuan:"Galon",harga:5000,jenis:"ops"},
];
const defRelawan=[{id:"r1",nama:"Relawan 1",gaji:100000},{id:"r2",nama:"Relawan 2",gaji:100000}];
const defTier=[{sampai:99,nominal:2000},{sampai:500,nominal:30000},{sampai:750,nominal:50000},{sampai:1000,nominal:60000},{sampai:2000,nominal:100000},{sampai:3000,nominal:200000}];
function ensureCfg(){const c=S.cfg;if(!c.pic)c.pic=[];if(!Array.isArray(c.tier)||!c.tier.length)c.tier=defTier.map(t=>({...t}));if(!c.posTarif)c.posTarif=1000;if(!c.fasilMode)c.fasilMode="jumat";if(!c.fasilJumatV1){c.fasilMode="jumat";c.fasilJumatV1=1;}if(c.mulai===undefined)c.mulai="";if(!c.fasilPay)c.fasilPay={nama:"",bank:"",rek:""};}
const defCfg={
  t1:8000,t2:10000,
  kepada:"Ketua Yayasan Kemala Bhayangkari",
  sppg:"SPPG POLRES OGAN ILIR 4 SUNGAI PINANG LAGATI",
  kota:"Ogan Ilir",kepala:"",
  nip:"",akun:"",
  pay:defPay,master:defMaster,relawan:defRelawan,pic:[]
};
function migratePay(pay){
  if(Array.isArray(pay))return pay;
  const lm={pangan:"Bahan pangan",kop:"Operasional (Koperasi)",air:"Air minum"};
  return Object.entries(pay).map(([id,v])=>({id,label:lm[id]||id,...v}));
}
const seed=()=>({
  id:uid(),tgl:"2026-10-01",
  menu:"NASI, AYAM GORENG BAWANG PUTIH, TEMPE OREK, WORTEL + KACANG PANJANG REBUS, BUAH MELON",
  pm1:1200,pm2:1100,
  items:[["BERAS TOPI KOKI (10 KG)",20,"KARUNG",155000],["AYAM POTONG",258,"KG",41000],["TAHU SAYUR",2580,"PCS",700],["WORTEL",45,"KG",18000],["MELON",235,"KG",18000]].map(a=>({n:a[0],q:a[1],s:a[2],h:a[3]})),
  ops:[{n:"Mama Lemon",q:40,s:"Pcs",h:10000,g:"kop"},{n:"Masker",q:20,s:"Kotak",h:28000,g:"kop"},{n:"Air Minum Isi Ulang",q:25,s:"Galon",h:5000,g:"air"}],
  dok:[],picOff:[],fasil:{tarif:2000,jml:""}
});

// === STATE ===
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.days){
  ["rab-spp-v3","rab-spp-v2","rab-spp-v1"].forEach(k=>{
    if(S)return;
    try{const old=JSON.parse(localStorage.getItem(k));if(old?.days){S=old;}}catch(e){}
  });
  if(S){
    S.cfg={...defCfg,...S.cfg,pay:migratePay(S.cfg?.pay||defPay),master:S.cfg?.master||defMaster,relawan:S.cfg?.relawan||defRelawan};
    delete S.cfg.top;
  }
}
if(!S||!S.days)S={cfg:{...defCfg,pay:defPay.map(p=>({...p})),master:defMaster.map(m=>({...m})),relawan:defRelawan.map(r=>({...r})),pic:[]},days:[seed()],cur:null,tab:"rab",seeded:true};
if(!S.cfg)S.cfg={...defCfg};
if(!Array.isArray(S.cfg.pay))S.cfg.pay=migratePay(S.cfg.pay);
if(!S.cfg.master)S.cfg.master=defMaster.map(m=>({...m}));
if(!S.cfg.relawan)S.cfg.relawan=defRelawan.map(r=>({...r}));
ensureCfg();
if(!S.absen)S.absen={};
S.cur=S.cur||S.days[0].id;
S.tab=S.tab||"rab";
if(S.tab==="insentif")S.tab="ops";

// Normalisasi hari
function normDay(d){
  if(!d.dok)d.dok=[];delete d.pic;if(!d.picOff)d.picOff=[];if(!d.ops)d.ops=[];if(!d.items)d.items=[];
  if(!d.fasil)d.fasil={tarif:2000,jml:""};
  if(d.insentif?.length){
    d.insentif.filter(x=>x.checked&&x.nama&&!/^gaji /i.test(x.nama)).forEach(x=>d.ops.push({n:x.nama,q:1,s:"hari",h:num(x.nominal),g:S.cfg.pay[1]?.id||"kop"}));
  }
  delete d.insentif;
  return d;
}
S.days.forEach(normDay);

function dedupDays(days){
  const map={};
  days.forEach(d=>{
    const tgl=d.tgl;
    if(!map[tgl]){map[tgl]=d;return;}
    const ex=map[tgl];
    if((d.items||[]).length>(ex.items||[]).length)ex.items=d.items;
    (d.ops||[]).forEach(ni=>{if(!ex.ops.find(i=>i.n&&ni.n&&i.n.toLowerCase()===ni.n.toLowerCase()))ex.ops.push(ni)});
    (d.dok||[]).forEach(dk=>{if(!ex.dok.find(i=>i.itemRef===dk.itemRef))ex.dok.push(dk)});
    if(!ex.menu&&d.menu)ex.menu=d.menu;
    if(!ex.pm1&&d.pm1)ex.pm1=d.pm1;
    if(!ex.pm2&&d.pm2)ex.pm2=d.pm2;
  });
  return Object.values(map);
}
// (dedup otomatis dimatikan – pakai tombol 🧹 Bersihkan Duplikat)
if(!S.days.find(d=>d.id===S.cur))S.cur=S.days[0]?.id||"";

// === HELPERS ===
const getPay=id=>S.cfg.pay.find(p=>p.id===id)||S.cfg.pay[0]||{};
const panganPay=()=>S.cfg.pay.find(p=>p.id==="pangan")||S.cfg.pay[0]||{};
const cur=()=>S.days.find(d=>d.id===S.cur)||S.days[0];
const pagu=d=>num(d.pm1)*S.cfg.t1+num(d.pm2)*S.cfg.t2;
const tot=l=>l.reduce((a,x)=>a+num(x.q)*num(x.h),0);
const tglTxt=d=>new Date(d.tgl+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const tglPanjang=d=>new Date(d.tgl+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});

const PIC_JENIS={
 posyandu:{label:"Posyandu",f:[["balita","Balita (K1)"],["bumil","Ibu Hamil (K2)"],["busui","Ibu Menyusui (K2)"]],k1:["balita"],k2:["bumil","busui"]},
 kb:{label:"Sekolah KB/PAUD",f:[["siswa","Jumlah Siswa (K1)"],["guru","Guru (K2)"]],k1:["siswa"],k2:["guru"]},
 sd:{label:"SD",f:[["c1","Kelas 1 (K1)"],["c2","Kelas 2 (K1)"],["c3","Kelas 3 (K1)"],["c4","Kelas 4 (K2)"],["c5","Kelas 5 (K2)"],["c6","Kelas 6 (K2)"],["guru","Guru (K2)"]],k1:["c1","c2","c3"],k2:["c4","c5","c6","guru"]},
 smp:{label:"SMP",f:[["c7","Kelas 7 (K2)"],["c8","Kelas 8 (K2)"],["c9","Kelas 9 (K2)"],["guru","Guru (K2)"]],k1:[],k2:["c7","c8","c9","guru"]}
};
const picK=(p,w)=>{const J=PIC_JENIS[p.jenis];return J?J[w].reduce((a,k)=>a+num(p.j?.[k]),0):0};
const getPic=id=>(S.cfg.pic||[]).find(p=>p.id===id);
const nf=n=>n.toLocaleString("id-ID");
const picHdr=p=>`K1 <b>${nf(picK(p,"k1"))}</b> · K2 <b>${nf(picK(p,"k2"))}</b> · ${rp(picHarian(p))}/hari`;
const picTotHtml=()=>{const L=S.cfg.pic||[];return`Total semua lokasi — K1 <b>${nf(L.reduce((a,p)=>a+picK(p,"k1"),0))}</b> · K2 <b>${nf(L.reduce((a,p)=>a+picK(p,"k2"),0))}</b>`};

const gajiRows=d=>(S.cfg.relawan||[]).filter(r=>S.absen[r.id]?.[d.tgl]).map(r=>({n:"Gaji "+r.nama,q:1,s:"hari",h:num(r.gaji)}));
const gajiTot=d=>gajiRows(d).reduce((a,x)=>a+x.h,0);
const fasilTarif=d=>d.fasil?num(d.fasil.tarif):2000;
const fasilJml=d=>(d.fasil&&num(d.fasil.jml))?num(d.fasil.jml):num(d.pm1)+num(d.pm2);
const fasilTot=d=>fasilTarif(d)*fasilJml(d);
const tierFor=n=>{const T=[...S.cfg.tier].sort((a,b)=>num(a.sampai)-num(b.sampai));for(const t of T)if(n<=num(t.sampai))return num(t.nominal);return T.length?num(T[T.length-1].nominal):0};
const picTotalPenerima=p=>picK(p,"k1")+picK(p,"k2");
const picHarian=p=>p.jenis==="posyandu"?(num(p.tarif)||num(S.cfg.posTarif))*picTotalPenerima(p):(num(p.insen)||tierFor(picTotalPenerima(p)));
const picAktifDay=d=>(S.cfg.pic||[]).filter(p=>!(d.picOff||[]).includes(p.id));
const picTot=d=>picAktifDay(d).reduce((a,p)=>a+picHarian(p),0);
const weekKey=tgl=>{const d=new Date(tgl+"T00:00:00"),day=d.getDay()||7;d.setDate(d.getDate()-(day-1));return isoDate(d)};
// Jumat penutup periode: Sabtu s.d. Jumat. Hari Sabtu/Minggu ikut periode Jumat berikutnya.
const closeFri=tgl=>{const x=new Date(tgl+"T00:00:00");x.setDate(x.getDate()+((5-x.getDay()+7)%7));return isoDate(x)};
function fasilPeriodTxt(d){
  const g=groupOf("w",d);if(!g)return"";
  const sub=g.days.reduce((a,x)=>a+fasilTot(x),0);
  if(S.cfg.fasilMode==="jumat"){
    const jt=new Date(g.closeTgl+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"});
    return`Akumulasi periode berjalan (${g.n} hari): <b>${rp(sub)}</b> · dibayar <b>${jt}</b>${g.isClose?" ✅ hari rekap":""}`;
  }
  return`Akumulasi periode berjalan (${g.n}/${g.size} hari): <b>${rp(sub)}</b>${g.isClose?" ✅ hari rekap":""}`;
}

  const all=[...S.days].sort((a,b)=>a.tgl.localeCompare(b.tgl)).filter(x=>!S.cfg.mulai||x.tgl>=S.cfg.mulai);
  const idx=all.findIndex(x=>x.id===d.id);if(idx<0)return null;
  if(kind==="w"&&S.cfg.fasilMode==="jumat"){
    const ck=closeFri(d.tgl),win=all.filter(x=>closeFri(x.tgl)===ck),days=win.filter(x=>x.tgl<=d.tgl);
    const adaJumat=all.some(x=>x.tgl===ck),adaLanjut=all.some(x=>x.tgl>ck);
    const isClose=d.tgl===ck||(!adaJumat&&adaLanjut&&win[win.length-1].id===d.id);
    return{days,n:days.length,size:win.length,isClose,closeTgl:ck};
  }
  const size=kind==="p10"?10:5,st=Math.floor(idx/size)*size,days=all.slice(st,idx+1);
  return{days,n:days.length,size,isClose:days.length===size};
}

function setSyncProgress(done,total,msg){

  if(fill)fill.style.width=total>0?Math.round(done/total*100)+"%":"0%";

const localSave=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){setSyncProgress(0,0,"⚠ Penyimpanan perangkat penuh");}};

const hasPendingPhoto=d=>(d.dok||[]).some(k=>(k.fotos||[]).some(isLocalImg));

async function http(url,opt,timeoutMs){
  const ctrl=new AbortController(),tid=setTimeout(()=>ctrl.abort(),timeoutMs||45000);
  try{
    const r=await fetch(url,{...opt,signal:ctrl.signal});
    const t=await r.text();let j;
    try{j=JSON.parse(t)}catch(e){throw new Error("Server tidak membalas dengan benar (cek deployment Apps Script)")}
    if(!j.ok){const er=new Error(j.error||"Terjadi kesalahan");er.auth=!!j.auth;throw er;}
    return j;
  }catch(e){
    if(e.name==="AbortError")throw new Error("Timeout – server lambat");
    if(e instanceof TypeError)throw new Error("Tidak ada koneksi ke server");
    throw e;
  }finally{clearTimeout(tid)}
}
const call=(b,timeoutMs)=>http(apiUrl(),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...b,token:session&&session.token})},timeoutMs);
const callGet=(p,timeoutMs)=>http(apiUrl()+"?"+new URLSearchParams({...p,token:session&&session.token}).toString(),{},timeoutMs);

const dayPayload=d=>({...d,insentifRows:insentifRows(d),dok:(d.dok||[]).map(k=>({...k,fotos:(k.fotos||[]).filter(f=>f.fid).map(f=>({fid:f.fid,ket:f.ket||""}))}))});

function pendingCount(){
  let n=SY.del.length;
  S.days.forEach(d=>{if(SY.days[d.id]!==dayStr(d))n++;(d.dok||[]).forEach(k=>(k.fotos||[]).forEach(f=>{if(isLocalImg(f))n++}))});
  if(SY.cfg!==cfgStr())n++;
  return n;
}

async function idleCheck(){
  if(!session||idleBusy||Date.now()-lastActive<IDLE_MS)return;
  idleBusy=true;
  try{if(loaded&&pendingCount()>0)await flush();}catch(e){}
  if(session){call({action:"logout"},8000).catch(()=>{});forceLogout("Keluar otomatis karena tidak digunakan selama 1 jam.");}
  idleBusy=false;
}
setInterval(idleCheck,30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)idleCheck()});

function forceLogout(msg){
  session=null;loaded=false;clearTimeout(tm);clearTimeout(retryTm);
  try{localStorage.removeItem(SESS_KEY)}catch(e){}
  document.getElementById("loginScreen").style.display="flex";
  document.querySelector(".app").style.display="none";
  const lm=document.getElementById("loginMsg");lm.style.color="var(--bad)";lm.textContent=msg||"";
  setSyncProgress(0,0,"Mode lokal");
}

async function flush(){
  if(!hasApi()||!loaded)return;
  if(isFlushing){rerun=true;return;}
  isFlushing=true;
  try{
    const photos=[];
    S.days.forEach(d=>(d.dok||[]).forEach(k=>(k.fotos||[]).forEach(f=>{if(isLocalImg(f))photos.push([d,f])})));
    if(!SY.del.length&&!photos.length&&SY.cfg===cfgStr()&&S.days.every(d=>SY.days[d.id]===dayStr(d)))return;
    setSyncProgress(0,1,"Menyinkron…");
    // 1) hapus hari
    for(const id of [...SY.del]){
      await call({action:"deleteDay",id});
      SY.del=SY.del.filter(x=>x!==id);delete SY.days[id];saveSY();
    }
    // 2) unggah foto ke Drive (satu per satu)
    let pi=0;
    for(const [d,f] of photos){
      pi++;setSyncProgress(0,1,"Mengunggah foto "+pi+"/"+photos.length+"…");
      const i=f.dataURL.indexOf(","),mime=f.dataURL.slice(5,f.dataURL.indexOf(";"));
      const r=await call({action:"uploadFoto",dayId:d.id,name:"foto_"+d.tgl+"_"+uid()+".jpg",mime,base64:f.dataURL.slice(i+1)},120000);
      f.fid=r.fid;f.dataURL=thumb(r.fid);localSave();
    }
    // 3) simpan hanya hari yang berubah
    for(const d of S.days){
      const p=dayPayload(d),s=JSON.stringify(p);
      if(SY.days[d.id]===s)continue;
      setSyncProgress(0,1,"Menyimpan "+d.tgl+"…");
      await call({action:"saveDay",day:p});
      SY.days[d.id]=s;saveSY();
    }
    // 4) konfigurasi
    const cs=cfgStr();
    if(SY.cfg!==cs){await call({action:"saveCfg",cfg:JSON.parse(cs)});SY.cfg=cs;saveSY();}
    setSyncProgress(1,1,"✅ Tersimpan");
    setTimeout(()=>{if(!isFlushing)setSyncProgress(0,0,"Tersambung")},2500);
  }catch(e){
    if(e.auth){forceLogout(e.message||"Sesi berakhir, silakan login lagi.");return;}
    setSyncProgress(0,0,"⚠ "+String(e.message).slice(0,50)+" – dicoba lagi 10 dtk");
    clearTimeout(retryTm);retryTm=setTimeout(flush,10000);
  }finally{
    isFlushing=false;
    if(rerun){rerun=false;setTimeout(flush,300);}
  }
}
// Perubahan selalu disimpan lokal dulu, lalu dikirim ke server 1,5 detik kemudian
const save=()=>{
  localSave();
  if(hasApi()){
    if(loaded)setSyncProgress(0,0,"Menunggu kirim…");
    clearTimeout(tm);tm=setTimeout(flush,1500);
  }
};

function compressImage(file,max=1280,q=0.72){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>{const im=new Image();im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);
      res(c.toDataURL("image/jpeg",q));
    };im.onerror=rej;im.src=rd.result};
    rd.onerror=rej;rd.readAsDataURL(file);
  });
}

function printDokPDF(di){
  const d=cur(),dk=d.dok[di];
  if(!dk||!dk.fotos.length){alert("Belum ada foto.");return;}
  const fotos=dk.fotos;let pages="";
  for(let i=0;i<fotos.length;i+=4){
    const chunk=fotos.slice(i,i+4);while(chunk.length<4)chunk.push(null);
    const cells=chunk.map(f=>f
      ?`<div style="border:2px solid #000;padding:4px;text-align:center;break-inside:avoid"><img src="${f.dataURL}" style="width:100%;height:200px;object-fit:cover"><div style="font-size:11px;font-family:'Times New Roman',serif;margin-top:4px;border-top:1px solid #ccc;padding-top:3px">${esc(f.ket)||"&nbsp;"}</div></div>`
      :`<div style="border:2px solid #ccc;padding:4px;height:220px;color:#ccc;display:flex;align-items:center;justify-content:center">kosong</div>`).join("");
    pages+=`<div style="page-break-after:always;padding:16px"><p style="font-family:'Times New Roman',serif;font-size:13px;margin:0 0 8px"><b>Dokumentasi: ${esc(dk.itemRef)}</b> — ${esc(tglPanjang(d))}<br><small>${esc(dk.keterangan||"")}</small></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${cells}</div></div>`;
  }
  const w=window.open("","_blank","width=800,height=600");
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Dokumentasi PDF</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#000}@media print{@page{margin:12mm}}</style></head><body>${pages}<script>window.onload=()=>{window.print();setTimeout(()=>window.close(),1000)}<\/script></body></html>`);
  w.document.close();
}

// === MINGGUAN ===
function mingguanView(){
  function getMinggu(tgl){
    const d=new Date(tgl+"T00:00:00"),day=d.getDay()||7;
    const mon=new Date(d);mon.setDate(d.getDate()-(day-1));
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    const k=mon.getFullYear()+"-"+String(mon.getMonth()+1).padStart(2,"0")+"-"+String(mon.getDate()).padStart(2,"0");
    return{key:k,label:`${mon.toLocaleDateString("id-ID",{day:"numeric",month:"short"})} – ${sun.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}`};
  }
  const weeks={};
  [...S.days].sort((a,b)=>a.tgl.localeCompare(b.tgl)).forEach(d=>{
    const w=getMinggu(d.tgl);
    if(!weeks[w.key])weeks[w.key]={label:w.label,days:[],tB:0,tP:0,tO:0,tI:0};
    weeks[w.key].days.push(d);weeks[w.key].tB+=tot(d.items);weeks[w.key].tP+=pagu(d);weeks[w.key].tO+=tot(d.ops);weeks[w.key].tI+=totInsentif(d);
  });
  const wkeys=Object.keys(weeks).sort().reverse();
  if(!wkeys.length)return`<div class="card"><p style="color:var(--mut)">Belum ada data.</p></div>`;
  return wkeys.map(wk=>{
    const w=weeks[wk],sisa=w.tP-w.tB;
    const dr=w.days.map((d,i)=>{const tb=tot(d.items),tp=pagu(d),si=tp-tb;return`<tr><td>${i+1}</td><td>${esc(tglPanjang(d))}</td><td class="n">${nf(num(d.pm1)+num(d.pm2))}</td><td class="n">${rp(tb)}</td><td class="n">${rp(tp)}</td><td class="n ${si<0?"bad":"ok"}">${rp(si)}</td><td class="n">${rp(tot(d.ops))}</td><td class="n">${rp(totInsentif(d))}</td></tr>`;}).join("");
    return`<div class="card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px">
        <b>📅 Minggu ${esc(w.label)}</b>
        <div style="font-size:12px;display:flex;gap:10px;flex-wrap:wrap">
          <span>Belanja: <b>${rp(w.tB)}</b></span><span>Pagu: <b>${rp(w.tP)}</b></span>
          <span>Sisa: <b class="${sisa<0?"bad":"ok"}">${rp(sisa)}</b></span>
          <span>Barang: <b>${rp(w.tO)}</b></span><span>Gaji+Insentif: <b>${rp(w.tI)}</b></span>
        </div>
      </div>
      <div class="tw"><table>
        <thead><tr><th>No</th><th>Tanggal</th><th class="n">PM</th><th class="n">Belanja</th><th class="n">Pagu</th><th class="n">Sisa</th><th class="n">Barang</th><th class="n">Gaji+Insentif</th></tr></thead>
        <tbody>${dr}</tbody>
        <tfoot><tr style="font-weight:600"><td colspan="3">Total</td><td class="n">${rp(w.tB)}</td><td class="n">${rp(w.tP)}</td><td class="n ${sisa<0?"bad":"ok"}">${rp(sisa)}</td><td class="n">${rp(w.tO)}</td><td class="n">${rp(w.tI)}</td></tr></tfoot>
      </table></div>
    </div>`;
  }).join("");
}

// === SPP ===
function spp(d){
  const c=S.cfg,T=tglPanjang(d),H=tglTxt(d).toUpperCase();
  const it=d.items.filter(x=>x.n&&num(x.q)*num(x.h));
  const pp=panganPay();
  const intro=(jenis,sub,tt="Tanggal "+T)=>`<p><b>SURAT PERMINTAAN PEMBAYARAN</b></p><p>Sifat : Segera<br>Perihal : Permintaan Pembayaran Dana Belanja ${jenis}.</p><p>Kepada Yth.<br>${esc(c.kepada)}<br>Di Tempat</p><p style="text-align:justify;text-indent:30px">Sehubungan dengan pelaksanaan kegiatan Makan Bergizi Gratis ${tt}. Di ${esc(c.sppg.replace("SPPG POLRES","SPPG Polres").replace("OGAN ILIR","Ogan Ilir").replace("SUNGAI PINANG LAGATI","Sungai Pinang Lagati"))}, maka kami mengajukan permintaan ${sub} kepada pihak ${esc(c.kepada.replace("Ketua ",""))} dengan rincian sebagai berikut :</p>`;
  const ttd=`<p style="text-align:justify;text-indent:30px">Demikian surat permintaan pembayaran ini kami buat dan ajukan untuk digunakan sebagaimana mestinya, atas perhatiannya kami ucapkan terima kasih.</p><div class="sign"><div>Menyetujui,<br>Kepala SPPG<br><br><br><br><u>${esc(c.kepala)}</u><br>${esc(c.nip)}</div><div>${esc(c.kota)}, ${T}<br>Akuntan SPPG<br><br><br><br><u>${esc(c.akun)}</u></div></div>`;
  const t1=`<div class="paper">${intro("Bahan Pangan","Pembayaran Dana Belanja Bahan Pangan")}<p style="text-align:center"><b>REKAP BIAYA BAHAN PANGAN<br>${esc(c.sppg)}<br>${H}</b></p><table><tr><th>No</th><th>Nama Bahan Baku</th><th>Qty</th><th>Satuan</th><th>Harga Satuan</th><th>Total Harga</th><th>No. Rekening</th><th>Bank</th><th>Supplier</th></tr>${it.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.n)}</td><td class="n">${nf(num(x.q))}</td><td>${esc(x.s)}</td><td class="n">${rp(x.h)}</td><td class="n">${rp(num(x.q)*num(x.h))}</td>${i?"<td></td><td></td><td></td>":`<td>${esc(pp.rek)}</td><td>${esc(pp.bank)}</td><td>${esc(pp.nama)}</td>`}</tr>`).join("")}<tr><td colspan="5"><b>TOTAL</b></td><td class="n"><b>${rp(tot(it))}</b></td><td colspan="3"></td></tr></table>${ttd}</div>`;

  // Operasional harian = barang saja (per penerima pembayaran)
  const opsById={};
  d.ops.filter(x=>x.n&&num(x.q)*num(x.h)).forEach(x=>{const g=x.g||S.cfg.pay[1]?.id||"kop";(opsById[g]=opsById[g]||[]).push(x)});
  const opsIds=Object.keys(opsById);
  let t2="";
  if(opsIds.length){
    const orow=x=>`<tr><td></td><td>${esc(x.n)}</td><td class="n">${nf(num(x.q))}</td><td>${esc(x.s||"")}</td><td class="n">${rp(x.h)}</td><td class="n">${rp(num(x.q)*num(x.h))}</td><td colspan="3"></td></tr>`;
    let rowNo=1,tbody="";
    opsIds.forEach(gid=>{
      const grp=opsById[gid],pv=getPay(gid);
      tbody+=`<tr><td>${rowNo++}</td><td colspan="5"><b>${esc(pv.label||pv.nama)}</b></td><td>${esc(pv.rek||"-")}</td><td>${esc(pv.bank||"-")}</td><td>${esc(pv.nama)}</td></tr>`;
      tbody+=grp.map(orow).join("");
      tbody+=`<tr><td colspan="5"><b>Total ${esc(pv.label||pv.nama)}</b></td><td class="n"><b>${rp(tot(grp))}</b></td><td colspan="3"></td></tr>`;
    });
    const totalOps=opsIds.reduce((a,gid)=>a+tot(opsById[gid]),0);
    t2=`<div class="paper">${intro("Operasional","Pembayaran Belanja Operasional (At-Cost)")}<p style="text-align:center"><b>REKAP BIAYA OPERASIONAL<br>${esc(c.sppg)}<br>${H}</b></p><table><tr><th>No</th><th>Nama Barang/Jasa</th><th>Qty</th><th>Satuan</th><th>Harga Satuan</th><th>Total Harga</th><th>No. Rekening</th><th>Bank</th><th>Penerima</th></tr>${tbody}<tr><td colspan="5"><b>TOTAL KESELURUHAN</b></td><td class="n"><b>${rp(totalOps)}</b></td><td colspan="3"></td></tr></table>${ttd}</div>`;
  }
  // Rekap periode: Gaji Relawan + Insentif PIC (10 hari), Insentif Fasilitas (5 hari / Jumat)
  const mode=S.sppMode||"auto",g10=groupOf("p10",d),gW=groupOf("w",d);
  const per=g=>`Periode ${tglPanjang(g.days[0])} s.d. ${tglPanjang(g.days[g.days.length-1])}`;
  const perDoc=(jenis,sub,ttl,tt,head,body,totRow)=>`<div class="paper">${intro(jenis,sub,tt)}<p style="text-align:center"><b>${ttl}<br>${esc(c.sppg)}<br>${esc(tt.toUpperCase())}</b></p><table><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${body}${totRow}</table>${ttd}</div>`;
  let t3="",t4="",t5="";
  if(g10&&(g10.isClose||mode==="p10"||mode==="both")){
    const gr=(S.cfg.relawan||[]).map(r=>({r,h:g10.days.filter(x=>S.absen[r.id]?.[x.tgl]).length})).filter(x=>x.h>0);
    if(gr.length){
      const T3=gr.reduce((a,x)=>a+x.h*num(x.r.gaji),0);
      t3=perDoc("Gaji Relawan","Pembayaran Gaji Relawan","REKAP GAJI RELAWAN",per(g10),["No","Nama Relawan","Hari Hadir","Gaji per Hari","Total Gaji"],
        gr.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.r.nama)}</td><td class="n">${x.h}</td><td class="n">${rp(x.r.gaji)}</td><td class="n">${rp(x.h*num(x.r.gaji))}</td></tr>`).join(""),
        `<tr><td colspan="4"><b>TOTAL</b></td><td class="n"><b>${rp(T3)}</b></td></tr>`);
    }
  }
  if(gW&&(gW.isClose||mode==="w"||mode==="both")){
    const pr=(S.cfg.pic||[]).map(p=>({p,h:gW.days.filter(x=>!(x.picOff||[]).includes(p.id)).length})).filter(x=>x.h>0&&picHarian(x.p)>0);
    if(pr.length){
      const T4=pr.reduce((a,x)=>a+x.h*picHarian(x.p),0);
      t4=perDoc("Insentif PIC","Pembayaran Insentif PIC","REKAP INSENTIF PIC",per(gW),["No","Sekolah / Posyandu","Penerima","Hari","Insentif per Hari","Total","No. Rekening","Bank","PIC"],
        pr.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.p.nama)}</td><td class="n">${nf(picTotalPenerima(x.p))}</td><td class="n">${x.h}</td><td class="n">${rp(picHarian(x.p))}</td><td class="n">${rp(x.h*picHarian(x.p))}</td><td>${esc(x.p.rek||"-")}</td><td>${esc(x.p.bank||"-")}</td><td>${esc(x.p.pic||"-")}</td></tr>`).join(""),
        `<tr><td colspan="5"><b>TOTAL</b></td><td class="n"><b>${rp(T4)}</b></td><td colspan="3"></td></tr>`);
    }
    const T5=gW.days.reduce((a,x)=>a+fasilTot(x),0);
    if(T5>0)t5=perDoc("Insentif Fasilitas","Pembayaran Insentif Fasilitas","REKAP INSENTIF FASILITAS",per(gW),["No","Tanggal","Jumlah Penerima","Tarif","Total","No. Rekening","Bank","Penerima"],
      gW.days.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(tglPanjang(x))}</td><td class="n">${nf(fasilJml(x))}</td><td class="n">${rp(fasilTarif(x))}</td><td class="n">${rp(fasilTot(x))}</td>${i?"<td></td><td></td><td></td>":`<td>${esc(S.cfg.fasilPay.rek||"-")}</td><td>${esc(S.cfg.fasilPay.bank||"-")}</td><td>${esc(S.cfg.fasilPay.nama||"-")}</td>`}</tr>`).join(""),
      `<tr><td colspan="4"><b>TOTAL</b></td><td class="n"><b>${rp(T5)}</b></td><td colspan="3"></td></tr>`);
  }
  return t1+t2+t3+t4+t5;
}

function buildGajiRows(){
  const relawan=S.cfg.relawan||[];
  const tgls=[...S.days].sort((a,b)=>a.tgl.localeCompare(b.tgl)).map(d=>d.tgl);
  const p1=S._absen_p1||tgls[0]||"",p2=S._absen_p2||tgls[tgls.length-1]||"";
  const tglsF=tgls.filter(t=>t>=p1&&t<=p2);
  return{p1,p2,tglsF,rows:relawan.map(r=>{
    const hadir=tglsF.filter(t=>S.absen[r.id]?.[t]).length;
    return{nama:r.nama,gaji:num(r.gaji),hadir,total:hadir*num(r.gaji)};
  })};
}
ev("#downloadGajiXls",()=>{
  if(typeof XLSX==="undefined")return alert("Library Excel belum termuat. Pastikan ada koneksi internet.");
  const{p1,p2,tglsF}=buildGajiRows();
  const tglHeaders=tglsF.map(t=>new Date(t+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short"}));
  const header=["Nama Relawan","Gaji/Hari",...tglHeaders,"Total Hari Hadir","Total Gaji"];
  const R=S.cfg.relawan||[];
  const dataRows=R.map(r=>{
    const checks=tglsF.map(t=>S.absen[r.id]?.[t]?"✓":"");
    const hadir=tglsF.filter(t=>S.absen[r.id]?.[t]).length;
    return[r.nama,num(r.gaji),...checks,hadir,hadir*num(r.gaji)];
  });
  const totalHadir=R.reduce((a,r)=>a+tglsF.filter(t=>S.absen[r.id]?.[t]).length,0);
  const totalGaji=R.reduce((a,r)=>a+tglsF.filter(t=>S.absen[r.id]?.[t]).length*num(r.gaji),0);
  const ws=XLSX.utils.aoa_to_sheet([header,...dataRows,["TOTAL","",...tglsF.map(()=>""),totalHadir,totalGaji]]);
  ws["!cols"]=[{wch:28},{wch:14},...tglsF.map(()=>({wch:6})),{wch:16},{wch:16}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Rekap Gaji");
  XLSX.writeFile(wb,`Rekap_Gaji_${p1}_sd_${p2}.xlsx`);
});
ev("#saveGajiSheets",()=>{
  if(!hasApi())return alert("Belum login ke server.");
  const{p1,p2,rows}=buildGajiRows();
  if(!rows.length)return alert("Tidak ada data relawan.");
  setSyncProgress(0,1,"Menyimpan rekap gaji ke Sheets…");
  call({action:"saveGaji",p1,p2,rows},15000)
    .then(()=>{setSyncProgress(1,1,"✅ Rekap gaji tersimpan di sheet GajiRelawan");setTimeout(()=>setSyncProgress(0,0,hasApi()?"Tersambung":"Mode lokal"),2500);})
    .catch(e=>{setSyncProgress(0,0,"⚠ Gagal: "+e.message.slice(0,40));});
});

ev("#relawanImpBtn",()=>document.getElementById("xlsRelInput").click());
document.getElementById("xlsRelInput").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const log=t=>{const el=document.getElementById("relawanImpLog");if(el)el.textContent=t;};
  if(typeof XLSX==="undefined"){log("Library Excel belum termuat.");return;}
  const rd=new FileReader();
  rd.onload=evt=>{
    try{
      let rows=[];
      if(f.name.toLowerCase().endsWith(".csv")){
        const text=new TextDecoder("utf-8").decode(new Uint8Array(evt.target.result));
        rows=text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(",").map(c=>c.replace(/^"|"$/g,"").trim()));
      }else{
        const wb=XLSX.read(evt.target.result,{type:"array"});
        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
      }
      if(!rows.length){log("File kosong.");return;}
      let hi=rows.findIndex(r=>r.some(c=>String(c).toLowerCase().includes("nama")));if(hi<0)hi=0;
      const hdr=rows[hi].map(h=>String(h).toLowerCase().trim());
      const cNama=hdr.findIndex(h=>h.includes("nama")),cGaji=hdr.findIndex(h=>h.includes("gaji")||h.includes("honor")||h.includes("upah")||h.includes("salary"));
      if(cNama<0){log("Kolom 'Nama' tidak ditemukan.");return;}
      let added=0,skip=0;
      rows.slice(hi+1).forEach(r=>{
        const nama=String(r[cNama]||"").trim();
        if(!nama||nama.toLowerCase().startsWith("catatan"))return;
        const gaji=cGaji>=0?num(r[cGaji]):0;
        if(S.cfg.relawan.some(rv=>rv.nama.toLowerCase()===nama.toLowerCase())){skip++;return;}
        S.cfg.relawan.push({id:"r_"+uid(),nama,gaji});added++;
      });
      save();view();
      const el=document.getElementById("relawanImpLog");if(el)el.textContent=`✅ ${added} relawan ditambahkan${skip?`, ${skip} duplikat dilewati`:""}.`;
    }catch(err){log("Gagal baca file: "+err.message);}
  };
  rd.readAsArrayBuffer(f);e.target.value="";
});

document.getElementById("xlsRabInput").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  if(typeof XLSX==="undefined"){alert("Library Excel belum termuat.");return;}
  const rd=new FileReader();rd.onload=evt=>{
    try{
      const wb=XLSX.read(evt.target.result,{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      let hi=rows.findIndex(r=>r.some(c=>String(c).toLowerCase().includes("tanggal")));if(hi<0){alert("Kolom Tanggal tidak ditemukan.");return;}
      const hdr=rows[hi].map(h=>String(h).toLowerCase());
      const ci={tgl:hdr.findIndex(h=>h.includes("tanggal")),menu:hdr.findIndex(h=>h.includes("menu")),pm1:hdr.findIndex(h=>h.includes("pm k1")||h.includes("k1")||h.includes("pm1")),pm2:hdr.findIndex(h=>h.includes("pm k2")||h.includes("k2")||h.includes("pm2")),jenis:hdr.findIndex(h=>h.includes("jenis")),nama:hdr.findIndex(h=>h.includes("nama")||h.includes("bahan")||h.includes("barang")),qty:hdr.findIndex(h=>h.includes("qty")||h.includes("jumlah")),sat:hdr.findIndex(h=>h.includes("satuan")||h.includes("unit")),harga:hdr.findIndex(h=>h.includes("harga")),pay:hdr.findIndex(h=>h.includes("penerima"))};
      if(ci.tgl<0||ci.nama<0)return alert("Kolom Tanggal dan Nama wajib ada.");
      const dayMap={};let lTgl="",lMenu="",lP1=0,lP2=0,added=0,skip=0;
      rows.slice(hi+1).forEach(r=>{
        const rTgl=String(r[ci.tgl]||"").trim();if(rTgl)lTgl=rTgl;
        if(ci.menu>=0&&String(r[ci.menu]||"").trim())lMenu=String(r[ci.menu]).trim();
        if(ci.pm1>=0&&String(r[ci.pm1]||"").trim())lP1=num(String(r[ci.pm1]));
        if(ci.pm2>=0&&String(r[ci.pm2]||"").trim())lP2=num(String(r[ci.pm2]));
        if(!lTgl)return;
        let tgl=lTgl;
        if(/^\d+$/.test(tgl)){const d=XLSX.SSF.parse_date_code(+tgl);tgl=`${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;}
        else if(/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}$/.test(tgl)){const p=tgl.split(/[\/\-]/);tgl=`${p[2]}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`;}
        if(!/^\d{4}-\d{2}-\d{2}$/.test(tgl)){skip++;return;}
        if(!dayMap[tgl])dayMap[tgl]={tgl,menu:lMenu,pm1:lP1,pm2:lP2,items:[],ops:[],dok:[],picOff:[],fasil:{tarif:2000,jml:""}};
        const nama=String(r[ci.nama]||"").trim();if(!nama)return;
        const qty=ci.qty>=0?num(r[ci.qty]):0,sat=ci.sat>=0?String(r[ci.sat]||"").trim():"",harga=ci.harga>=0?num(r[ci.harga]):0;
        const jenis=String(r[ci.jenis]||"bahan").toLowerCase().startsWith("ops")?"ops":"bahan";
        const payId=ci.pay>=0?String(r[ci.pay]||"").trim():"";
        if(jenis==="ops")dayMap[tgl].ops.push({n:nama,q:qty,s:sat,h:harga,g:payId||S.cfg.pay[1]?.id||"kop"});
        else dayMap[tgl].items.push({n:nama,q:qty,s:sat,h:harga});
        added++;
      });
      const tgls=Object.keys(dayMap).sort();if(!tgls.length){alert("Tidak ada data valid.");return;}
      let nD=0,uD=0;
      tgls.forEach(tgl=>{const imp=dayMap[tgl],ex=S.days.find(d=>d.tgl===tgl);
        if(ex){imp.items.forEach(ni=>{if(!ex.items.find(i=>i.n.toLowerCase()===ni.n.toLowerCase()))ex.items.push(ni)});imp.ops.forEach(ni=>{if(!ex.ops.find(i=>i.n.toLowerCase()===ni.n.toLowerCase()))ex.ops.push(ni)});uD++;}
        else{S.days.push({id:uid(),...imp});nD++;}
      });
      S.cur=[...S.days].sort((a,b)=>b.tgl.localeCompare(a.tgl))[0].id;
      save();view();alert(`✅ Import selesai!\n• ${nD} hari baru\n• ${uD} hari diperbarui\n• ${added} item diproses${skip>0?`\n• ${skip} baris dilewati`:""}`);
    }catch(err){alert("Gagal: "+err.message);}
  };rd.readAsArrayBuffer(f);e.target.value="";
});

async function loadRemote(){
  if(!hasApi())return;
  clearTimeout(retryTm);
  setSyncProgress(0,1,"Memuat dari server…");
  try{
    const j=await callGet({action:"load"},60000);
    const serverDays=(j.days||[]).filter(d=>d&&d.id);
    const wasSeed=!!S.seeded;delete S.seeded;
    if(wasSeed&&serverDays.length)S.days=[];
    // 1) catat hari lokal mana yang punya perubahan belum terkirim (sebelum apa pun diubah)
    const dirtyMap={};
    S.days.forEach(d=>{dirtyMap[d.id]=SY.days[d.id]===undefined||SY.days[d.id]!==dayStr(d)||hasPendingPhoto(d)});
    // 2) konfigurasi: ambil dari server kecuali ada perubahan lokal belum terkirim
    const cfgLocalDirty=SY.cfg!==""&&SY.cfg!==cfgStr();
    if(j.cfg&&!cfgLocalDirty){
      if(SY.cfg===""&&!wasSeed){try{localStorage.setItem("rab-backup-sebelum-sinkron",JSON.stringify(S))}catch(e){}}
      const{absen,...rest}=j.cfg;
      S.cfg={...defCfg,...rest};
      if(absen)S.absen=absen;
      if(!Array.isArray(S.cfg.pay))S.cfg.pay=migratePay(S.cfg.pay||defPay);
      if(!S.cfg.master)S.cfg.master=defMaster.map(m=>({...m}));
      if(!S.cfg.relawan)S.cfg.relawan=defRelawan.map(r=>({...r}));
      ensureCfg();
      if(!S.absen)S.absen={};
    }
    // 3) gabungkan hari
    const serverIds=new Set(serverDays.map(d=>d.id));
    const keep=[],dirtyKept=new Set();
    S.days.forEach(d=>{
      if(!serverIds.has(d.id)&&SY.days[d.id]!==undefined&&!dirtyMap[d.id]){delete SY.days[d.id];return;} // dihapus di perangkat lain
      keep.push(d);if(dirtyMap[d.id])dirtyKept.add(d.id);
    });
    serverDays.forEach(sd=>{
      normDay(sd);hydrate(sd);
      const loc=keep.find(x=>x.id===sd.id);
      if(!loc){if(!SY.del.includes(sd.id))keep.push(sd);}
      else if(!dirtyKept.has(loc.id)){Object.keys(loc).forEach(k=>delete loc[k]);Object.assign(loc,sd);}
    });
    S.days=keep;
    if(!S.days.length)S.days=[seed()];
    S.days.forEach(normDay);
    // 4) baseline: semua yang tidak berubah dianggap sudah tersinkron
    S.days.forEach(d=>{if(!dirtyKept.has(d.id))SY.days[d.id]=dayStr(d)});
    if(j.cfg&&!cfgLocalDirty)SY.cfg=cfgStr();
    if(!S.days.find(x=>x.id===S.cur))S.cur=S.days[0].id;
    loaded=true;localSave();saveSY();view();
    setSyncProgress(1,1,"✅ Dimuat dari server");
    setTimeout(()=>{if(!isFlushing)setSyncProgress(0,0,"Tersambung")},2500);
    flush();
  }catch(e){
    if(e.auth){forceLogout(e.message||"Sesi berakhir, silakan login lagi.");return;}
    setSyncProgress(0,0,"⚠ "+String(e.message).slice(0,50)+" – coba lagi 10 dtk");
    retryTm=setTimeout(loadRemote,10000);
  }
}

const _v = view;
function masukAplikasi() {
  loginScreen.style.display = "none";
  document.querySelector('.app').style.display = window.innerWidth <= 760 ? "block" : "grid";
  
  if (hasApi()) loadRemote();
  else setSyncProgress(0,0,"Mode lokal");
  
  view = function(){
    dlEl.innerHTML=Object.keys(catalog()).map(k=>`<option value="${esc(k)}">`).join("");
    _v();
  };
  view(); 
}

if(!/^https:\/\//.test(API_URL))document.getElementById("urlRow").style.display="block";
if(hasApi()&&Date.now()-lastActive>=IDLE_MS)forceLogout("Sesi berakhir karena tidak digunakan lebih dari 1 jam. Silakan login lagi.");
else if(hasApi()){markActive();masukAplikasi();}
</script></body></html>
